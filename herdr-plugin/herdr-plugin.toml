id = "harness.launcher"
name = "harness-launcher"
version = "0.41.0"
min_herdr_version = "0.9.1"
description = "Tab labels from agent session titles and notifications that focus the agent pane"
platforms = ["macos"]

[[startup]]
command = ["/usr/bin/python3", "harness_herdr_plugin.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["/usr/bin/python3", "harness_herdr_plugin.py"]

[[events]]
on = "pane.agent_detected"
command = ["/usr/bin/python3", "harness_herdr_plugin.py"]

[[events]]
on = "pane.focused"
command = ["/usr/bin/python3", "harness_herdr_plugin.py"]

[[events]]
on = "pane.created"
command = ["/usr/bin/python3", "harness_herdr_plugin.py"]

[[events]]
on = "pane.closed"
command = ["/usr/bin/python3", "harness_herdr_plugin.py"]

[[events]]
on = "pane.moved"
command = ["/usr/bin/python3", "harness_herdr_plugin.py"]

[[events]]
on = "tab.created"
command = ["/usr/bin/python3", "harness_herdr_plugin.py"]

[[events]]
on = "tab.renamed"
command = ["/usr/bin/python3", "harness_herdr_plugin.py"]
