          CI_STATUS_HEADLESS: ${{ needs.regression-headless.result }}
          CI_STATUS_HEADLESS_SECURITY: ${{ needs.regression-headless-security.result }}
          CI_STATUS_HEADLESS_CODEX: ${{ needs.regression-headless-codex.result }}
          CI_STATUS_SHELL_EXTRA: ${{ needs.regression-shell-extra.result }}
          CI_STATUS_TARGET: ${{ needs.regression-target.result }}
          CI_STATUS_SESSIONS: ${{ needs.regression-sessions.result }}
          CI_STATUS_SHELL: ${{ needs.regression-shell.result }}
          CI_STATUS_PRESERVATION: ${{ needs.regression-preservation.result }}
          CI_STATUS_PYTHON: ${{ needs.regression-python.result }}
          CI_RESULT_HEADLESS: ${{ needs.regression-headless.outputs.result }}
          CI_RESULT_HEADLESS_SECURITY: ${{ needs.regression-headless-security.outputs.result }}
          CI_RESULT_HEADLESS_CODEX: ${{ needs.regression-headless-codex.outputs.result }}
          CI_RESULT_SHELL_EXTRA: ${{ needs.regression-shell-extra.outputs.result }}
          CI_RESULT_TARGET: ${{ needs.regression-target.outputs.result }}
          CI_RESULT_SESSIONS: ${{ needs.regression-sessions.outputs.result }}
          CI_RESULT_SHELL: ${{ needs.regression-shell.outputs.result }}
          CI_RESULT_PRESERVATION: ${{ needs.regression-preservation.outputs.result }}
          CI_RESULT_PYTHON: ${{ needs.regression-python.outputs.result }}
        run: |
          set -euo pipefail
          [[ "$CI_STATUS_HEADLESS" == success ]] || exit 1
          [[ "$CI_STATUS_HEADLESS_SECURITY" == success ]] || exit 1
          [[ "$CI_STATUS_HEADLESS_CODEX" == success ]] || exit 1
          [[ "$CI_STATUS_SHELL_EXTRA" == success ]] || exit 1
          [[ "$CI_STATUS_TARGET" == success ]] || exit 1
          [[ "$CI_STATUS_SESSIONS" == success ]] || exit 1
          [[ "$CI_STATUS_SHELL" == success ]] || exit 1
          [[ "$CI_STATUS_PRESERVATION" == success ]] || exit 1
          [[ "$CI_STATUS_PYTHON" == success ]] || exit 1
          ./test/run-all.sh --ci-verify
