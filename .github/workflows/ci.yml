name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Commands below use only checked-in paths and runner-provided tool locations.
# No issue, pull request, commit, or ref text is interpolated into shell commands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omp-evidence-capture:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install evidence dependencies
        run: |
          brew install bash python@3.13 jq
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"
      - name: Prepare owned hosted Homebrew directory modes
        run: python3 -I -S -B test/omp-ci-owned-homebrew.py
      - name: Capture actual non-system jq and unchanged source closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY_CAPTURE'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import subprocess
          root = Path.cwd().resolve()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"]
          spec = importlib.util.spec_from_file_location("jq_capture", root / "test/omp-jq-ci-proof.py")
          proof = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(proof)
          raw = (root / "test/fixtures/omp-jq-v2-p1-evidence.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest() == proof.CAPSULE_SHA256
          capsule = proof.decode(raw)
          def source_pins():
              result = []
              for pin in capsule["source_pins"]:
                  body, mode = proof.read_source(root, pin["path"])
                  result.append({
                      "path": pin["path"], "bytes": len(body), "mode": mode,
                      "sha256": hashlib.sha256(body).hexdigest(),
                  })
              return result
          before = source_pins()
          ordinary, normal_branch = proof.inspect(root, False, subprocess.run)
          strict, strict_branch = proof.inspect(root, True, subprocess.run)
          assert normal_branch == strict_branch == "NON_SYSTEM"
          assert before == source_pins()
          public = {key: ordinary[key] for key in proof.HISTORICAL_KEYS}
          restricted = {key: strict[key] for key in proof.HISTORICAL_KEYS}
          assert public == restricted
          receipt = json.dumps({"head": head, "source_pins": before},
                               sort_keys=True, separators=(",", ":")).encode()
          print("JQ_SOURCE_RECEIPT=" + receipt.decode())
          print("JQ_SOURCE_RECEIPT_SHA256=" + hashlib.sha256(receipt).hexdigest())
          print("JQ_CAPTURE_ORDINARY=" + json.dumps(public, sort_keys=True))
          print("JQ_CAPTURE_STRICT=" + json.dumps(restricted, sort_keys=True))
          print("JQ_CAPTURE_STATUS=NON_SYSTEM_PASSED;native_calls=0")
          (Path(os.environ["RUNNER_TEMP"]) / "omp-jq-evidence.json").write_text(
              json.dumps({"head": head, "source_pins": before, "ordinary": public,
                          "strict": restricted}, sort_keys=True, indent=2) + "\n")
          PY_CAPTURE
      - name: Retain actual public evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omp-jq-evidence
          path: ${{ runner.temp }}/omp-jq-evidence.json
          if-no-files-found: error
          retention-days: 7

  regression-headless:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
    outputs:
      result: ${{ steps.regression.outputs.result }}

    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install runtime dependencies
        run: |
          brew install bash python@3.13 jq
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"

      # Trusted ephemeral macos-14 job only; never a local maintenance command.
      - name: Prepare owned CI Homebrew directory modes
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_ci_owned_homebrew.py
          python3 -I -S -B test/test_omp_ci_owned_homebrew_errors.py
          python3 -I -S -B test/omp-ci-owned-homebrew.py

      - name: Verify source-bound jq proof and current host branch
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_jq_ci_proof.py
          python3 -I -S -B test/omp-jq-ci-proof.py

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash_bin="$(brew --prefix)/bin/bash"
          for file in install.sh bin/*.sh test/*.sh; do
            first_line="$(sed -n '1p' "$file")"
            if [[ "$first_line" == *zsh* ]]; then
              /bin/zsh -n "$file"
            else
              "$bash_bin" -n "$file"
            fi
          done
          /bin/zsh -n bin/aliases.zsh

      - name: Lint public documentation
        run: npx --yes markdownlint-cli2@latest README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md 'docs/*.md' '.github/*.md'

      - name: Run regression suite
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/ci-headless.json"
          BASH_BIN="$(brew --prefix)/bin/bash" ZSH_BIN=/bin/zsh ./test/run-all.sh --ci-group headless --ci-result "$result"
          printf 'result=%s\n' "$(cat "$result")" >> "$GITHUB_OUTPUT"

  regression-shell:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
    outputs:
      result: ${{ steps.regression.outputs.result }}

    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Fixed historical objects for the public-dispatch regression only.
      - name: Fetch pinned public-dispatch test baseline
        shell: bash
        run: git fetch --no-tags --depth=1 origin 5faf9b91411faeb33f48beb0ab8b69a8575a0813

      - name: Install runtime dependencies
        run: |
          brew install bash python@3.13 jq
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"

      # Trusted ephemeral macos-14 job only; never a local maintenance command.
      - name: Prepare owned CI Homebrew directory modes
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_ci_owned_homebrew.py
          python3 -I -S -B test/test_omp_ci_owned_homebrew_errors.py
          python3 -I -S -B test/omp-ci-owned-homebrew.py

      - name: Verify source-bound jq proof and current host branch
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_jq_ci_proof.py
          python3 -I -S -B test/omp-jq-ci-proof.py

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash_bin="$(brew --prefix)/bin/bash"
          for file in install.sh bin/*.sh test/*.sh; do
            first_line="$(sed -n '1p' "$file")"
            if [[ "$first_line" == *zsh* ]]; then
              /bin/zsh -n "$file"
            else
              "$bash_bin" -n "$file"
            fi
          done
          /bin/zsh -n bin/aliases.zsh

      - name: Lint public documentation
        run: npx --yes markdownlint-cli2@latest README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md 'docs/*.md' '.github/*.md'

      - name: Run regression suite
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/ci-shell.json"
          BASH_BIN="$(brew --prefix)/bin/bash" ZSH_BIN=/bin/zsh ./test/run-all.sh --ci-group shell --ci-result "$result"
          printf 'result=%s\n' "$(cat "$result")" >> "$GITHUB_OUTPUT"

  regression-preservation:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
    outputs:
      result: ${{ steps.regression.outputs.result }}

    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install runtime dependencies
        run: |
          brew install bash python@3.13 jq
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"

      # Trusted ephemeral macos-14 job only; never a local maintenance command.
      - name: Prepare owned CI Homebrew directory modes
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_ci_owned_homebrew.py
          python3 -I -S -B test/test_omp_ci_owned_homebrew_errors.py
          python3 -I -S -B test/omp-ci-owned-homebrew.py

      - name: Verify source-bound jq proof and current host branch
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_jq_ci_proof.py
          python3 -I -S -B test/omp-jq-ci-proof.py

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash_bin="$(brew --prefix)/bin/bash"
          for file in install.sh bin/*.sh test/*.sh; do
            first_line="$(sed -n '1p' "$file")"
            if [[ "$first_line" == *zsh* ]]; then
              /bin/zsh -n "$file"
            else
              "$bash_bin" -n "$file"
            fi
          done
          /bin/zsh -n bin/aliases.zsh

      - name: Lint public documentation
        run: npx --yes markdownlint-cli2@latest README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md 'docs/*.md' '.github/*.md'

      - name: Run regression suite
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/ci-preservation.json"
          BASH_BIN="$(brew --prefix)/bin/bash" ZSH_BIN=/bin/zsh ./test/run-all.sh --ci-group preservation --ci-result "$result"
          printf 'result=%s\n' "$(cat "$result")" >> "$GITHUB_OUTPUT"

  regression-python:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
    outputs:
      result: ${{ steps.regression.outputs.result }}

    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install runtime dependencies
        run: |
          brew install bash python@3.13 jq
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"

      # Trusted ephemeral macos-14 job only; never a local maintenance command.
      - name: Prepare owned CI Homebrew directory modes
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_ci_owned_homebrew.py
          python3 -I -S -B test/test_omp_ci_owned_homebrew_errors.py
          python3 -I -S -B test/omp-ci-owned-homebrew.py

      - name: Verify source-bound jq proof and current host branch
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_jq_ci_proof.py
          python3 -I -S -B test/omp-jq-ci-proof.py

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash_bin="$(brew --prefix)/bin/bash"
          for file in install.sh bin/*.sh test/*.sh; do
            first_line="$(sed -n '1p' "$file")"
            if [[ "$first_line" == *zsh* ]]; then
              /bin/zsh -n "$file"
            else
              "$bash_bin" -n "$file"
            fi
          done
          /bin/zsh -n bin/aliases.zsh

      - name: Lint public documentation
        run: npx --yes markdownlint-cli2@latest README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md 'docs/*.md' '.github/*.md'

      - name: Run regression suite
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/ci-python.json"
          BASH_BIN="$(brew --prefix)/bin/bash" ZSH_BIN=/bin/zsh ./test/run-all.sh --ci-group python --ci-result "$result"
          printf 'result=%s\n' "$(cat "$result")" >> "$GITHUB_OUTPUT"

  test:
    if: ${{ always() }}
    needs: [regression-headless, regression-shell, regression-preservation, regression-python]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install verifier Python
        run: |
          brew install python@3.13
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"

      - name: Verify complete regression results
        env:
          CI_STATUS_HEADLESS: ${{ needs.regression-headless.result }}
          CI_STATUS_SHELL: ${{ needs.regression-shell.result }}
          CI_STATUS_PRESERVATION: ${{ needs.regression-preservation.result }}
          CI_STATUS_PYTHON: ${{ needs.regression-python.result }}
          CI_RESULT_HEADLESS: ${{ needs.regression-headless.outputs.result }}
          CI_RESULT_SHELL: ${{ needs.regression-shell.outputs.result }}
          CI_RESULT_PRESERVATION: ${{ needs.regression-preservation.outputs.result }}
          CI_RESULT_PYTHON: ${{ needs.regression-python.outputs.result }}
        run: |
          set -euo pipefail
          [[ "$CI_STATUS_HEADLESS" == success ]] || exit 1
          [[ "$CI_STATUS_SHELL" == success ]] || exit 1
          [[ "$CI_STATUS_PRESERVATION" == success ]] || exit 1
          [[ "$CI_STATUS_PYTHON" == success ]] || exit 1
          ./test/run-all.sh --ci-verify
