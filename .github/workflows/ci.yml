name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Commands below use only checked-in paths and runner-provided tool locations.
# No issue, pull request, commit, or ref text is interpolated into shell commands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-headless:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
    outputs:
      result: ${{ steps.regression.outputs.result }}

    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install runtime dependencies
        run: |
          brew install bash python@3.13 jq
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"

      # Trusted ephemeral macos-14 job only; never a local maintenance command.
      - name: Prepare owned CI Homebrew directory modes
        run: |
          set -euo pipefail
          python3 -I -S -B test/test_omp_ci_owned_homebrew.py
          python3 -I -S -B test/test_omp_ci_owned_homebrew_errors.py
          python3 -I -S -B test/omp-ci-owned-homebrew.py

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash_bin="$(brew --prefix)/bin/bash"
          for file in install.sh bin/*.sh test/*.sh; do
            first_line="$(sed -n '1p' "$file")"
            if [[ "$first_line" == *zsh* ]]; then
              /bin/zsh -n "$file"
            else
              "$bash_bin" -n "$file"
            fi
          done
          /bin/zsh -n bin/aliases.zsh

      - name: Lint public documentation
        run: npx --yes markdownlint-cli2@latest README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md 'docs/*.md' '.github/*.md'

      - name: Run regression suite
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/ci-headless.json"
          BASH_BIN="$(brew --prefix)/bin/bash" ZSH_BIN=/bin/zsh ./test/run-all.sh --ci-group headless --ci-result "$result"
          printf 'result=%s\n' "$(cat "$result")" >> "$GITHUB_OUTPUT"

